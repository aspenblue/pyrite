---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: pyrite-lite-fe

description: "Personal Fedora Atomic image based on Universal Blue, with Pantheon DE."

base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:

  - from-file: ../modules/20-system/common-system.yml
  - from-file: ../modules/30-apps/common-apps.yml
  - from-file: ../modules/30-apps/common-fe-apps.yml  
  - from-file: ../modules/50-shell/pantheon-repos.yml
  - from-file: ../modules/50-shell/pantheon-dock-lite.yml   
  - from-file: ../modules/50-shell/pantheon-shell.yml
  - from-file: ../modules/50-shell/lightdm.yml
  - from-file: ../modules/60-desktop/common-fe-desktop.yml
  - from-file: ../modules/60-desktop/pantheon-desktop.yml
  - from-file: ../modules/60-desktop/pantheon-lite-desktop.yml  
  - from-file: ../modules/60-desktop/pantheon-fe-desktop.yml
  - from-file: ../modules/70-style/pantheon-style.yml    
  - from-file: ../modules/70-style/pantheon-fe-style.yml  
  - from-file: ../modules/80-cleanup/common-cleanup.yml
  - from-file: ../modules/80-cleanup/common-fe-cleanup.yml


  # -----------------------------------------------
  # OS details
  # -----------------------------------------------

  - type: os-release
    properties:
      ID: aspenblue-pyrite
      ID_LIKE: fedora
      NAME: "Aspenblue Pyrite"
      PRETTY_NAME: "Aspenblue Pyrite 44 (Universal Blue)"
      VERSION: "44"
      DEFAULT_HOSTNAME: pyrite
      VARIANT: "Lite FE"
      VARIANT_ID: lite-fe 
      HOME_URL: "https://github.com/aspenblue/pyrite"


  # -----------------------------------------------
  # Sign image
  # -----------------------------------------------

  - type: signing
