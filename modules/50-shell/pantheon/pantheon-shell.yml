---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules: 

  # -----------------------------------------------
  # Pantheon packages
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - aspenblue/pantheon
    install:    
      packages:
        - pantheon-agent-polkit

  - type: dnf
    install:
      packages:
        #- metapkg-pantheon-shell
        - elementary-dock
        - elementary-greeter
        - elementary-settings
        - elementary-settings-daemon
        - gala
        - gala-wayland
        #- pantheon-agent-polkit
        - wingpanel
        - xdg-desktop-portal-pantheon
        - elementary-screenshot
        - elementary-sound-theme
        - elementary-bluetooth-daemon
        - elementary-initial-setup
        - elementary-monitor
        - elementary-shortcut-overlay
        - elementary-sideload
        - gcr
        - pantheon-session-settings
        - plymouth-theme-elementary
        - switchboard


  # -----------------------------------------------
  # Shell flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - io.github.pantheon_tweaks.pantheon-tweaks


  # -----------------------------------------------
  # Pantheon configuration
  # -----------------------------------------------

  - type: files
    files:
      - source: rootfs/pantheon
        destination: /


  # -----------------------------------------------
  # Pantheon polkit agent services
  # -----------------------------------------------     

  - type: systemd
    user:
      enabled:
        - io.elementary.desktop.agent-polkit.service
