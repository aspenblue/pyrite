---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules: 

  # -----------------------------------------------
  # Pantheon repository
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - garaevdi/pantheon-rpm

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - elementary-terminal
        - elementary-files
        - elementary-files-portal
        - elementary-onboarding
        #- appcenter
        - elementary-code


  # -----------------------------------------------
  # Webapp-manager repository
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - kylegospo/webapp-manager

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - webapp-manager        

  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:

          # Office
          - org.onlyoffice.desktopeditors # Офис

          # Web
          - org.mozilla.firefox           # Браузер
          - com.getmailspring.Mailspring  # Почта

          # Apps
          - io.github.kolunmi.Bazaar      # Магазин приложений


  # -----------------------------------------------
  # Elementary flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        repo:
          url: https://flatpak.elementary.io/repo.flatpakrepo
          name: elementary
          title: elementary AppCenter
        install:

          # Basic
          - io.elementary.calculator//stable      # Калькулятор
          - io.elementary.calendar//stable        # Календарь
          - io.elementary.tasks//stable           # Задачи
          - io.elementary.iconbrowser//stable     # Иконки
          - io.elementary.maps//stable            # Карты
          #- io.elementary.contacts//daily
          - io.elementary.screenshot//stable

          # Media
          - io.elementary.photos//stable          # Изображения
          - io.elementary.videos//stable          # Видео
          - io.elementary.camera//stable          # Камера
          - io.elementary.music//stable           # Музыка

          # Web
          - io.elementary.mail//daily             # Почта
          - io.elementary.capnet-assist//stable   # Помощник авторизации wifi
