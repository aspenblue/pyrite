---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules: 

  # -----------------------------------------------
  # Pantheon repository
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - elementary-terminal
        - elementary-files
        - elementary-files-portal
        - elementary-onboarding
        - appcenter
        - elementary-code


  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:

          # Web
          - org.mozilla.firefox

  # -----------------------------------------------
  # Elementary flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        repo:
          url: https://flatpak.elementary.io/repo.flatpakrepo
          name: elementary
          title: elementary AppCenter
        install:

          # Basic
          - io.elementary.calculator//stable
          - io.elementary.calendar//stable
          - io.elementary.tasks//stable
          - io.elementary.iconbrowser//stable
          - io.elementary.maps//stable
          #- io.elementary.contacts//daily
          - io.elementary.screenshot//stable

          # Media
          - io.elementary.photos//stable
          - io.elementary.videos//stable
          - io.elementary.camera//stable
          - io.elementary.music//stable

          # Web
          - io.elementary.mail//daily
          - io.elementary.capnet-assist//stable
