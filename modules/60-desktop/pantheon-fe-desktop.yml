---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules: 

  # -----------------------------------------------
  # Remove mainline packages
  # -----------------------------------------------

  - type: dnf
    remove:
      packages:
        - appcenter
        - elementary-mail


  # -----------------------------------------------
  # Webapp-manager repository
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - aspenblue/xapps
    install:
      packages:
        - webapp-manager


  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:

          # Office
          - org.onlyoffice.desktopeditors

          # Web
          - com.getmailspring.Mailspring

          # Apps
          - io.github.kolunmi.Bazaar
