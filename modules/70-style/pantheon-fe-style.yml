---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules: 

  # -----------------------------------------------
  # Dconf system definitions
  # -----------------------------------------------

  - type: files
    files:
      - source: rootfs/pantheon-fe-style
        destination: /


  # -----------------------------------------------
  # Dconf system definitions apply
  # -----------------------------------------------     

  - type: script
    snippets:
      - dconf update


  - type: script
    snippets:
      - ls -l /etc/dconf/db/distro.d/
      - cat /etc/dconf/db/distro.d/11-org-gnome
      - dconf update
      - ls -l /etc/dconf/db/distro