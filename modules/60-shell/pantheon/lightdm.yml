---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules: 

  # -----------------------------------------------
  # Greeter packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # Cinnamon display manager and greeter stack.
        - lightdm
        - lightdm-gtk
        - slick-greeter


  # -----------------------------------------------
  # Lightdm configuration
  # -----------------------------------------------

  - type: files
    files:
      - source: rootfs/lightdm
        destination: /


  # -----------------------------------------------
  # Pam fix script
  # -----------------------------------------------     

  - type: script
    scripts:
      - lightdm-fix-pam.sh


  # -----------------------------------------------
  # Greeter services
  # -----------------------------------------------     

  - type: systemd
    system:
      enabled:
        - lightdm.service